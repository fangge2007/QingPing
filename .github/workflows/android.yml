name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled compile SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Build and test the app and fixtures
        run: bash scripts/verify.sh
      - name: Publish verification summary
        run: cat app/build/reports/verification/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve test, lint and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            fixture/build/reports/
          if-no-files-found: warn
