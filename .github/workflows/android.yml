name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test the app and fixtures
        run: >-
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:jacocoServiceCoverageVerification
          :app:lintDebug :app:processReleaseManifest :fixture:assembleDebug
          :fixture:lintDebug :fixturetarget:assembleDebug --no-daemon --console=plain
      - name: Confirm release manifest is not debuggable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifests = list(Path('app/build/intermediates/merged_manifests/release').rglob('AndroidManifest.xml'))
          assert manifests, 'Release manifest missing'
          for path in manifests:
              app = ET.parse(path).getroot().find('application')
              assert app.get('{http://schemas.android.com/apk/res/android}debuggable', 'false') == 'false'
          PY
      - name: Preserve test, lint and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            fixture/build/reports/
          if-no-files-found: warn
