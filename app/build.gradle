plugins {
    id 'com.android.application'
    id 'jacoco'
}

android {
    namespace 'cn.qingping.app'
    compileSdk rootProject.ext.androidCompileSdk
    buildToolsVersion rootProject.ext.androidBuildTools
    defaultConfig {
        applicationId 'cn.qingping.app'
        minSdk 26
        targetSdk rootProject.ext.androidCompileSdk
        versionCode 6
        versionName '0.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        release {
            if (System.getenv('QINGPING_KEYSTORE')) {
                storeFile file(System.getenv('QINGPING_KEYSTORE'))
                storePassword System.getenv('QINGPING_STORE_PASSWORD')
                keyAlias System.getenv('QINGPING_KEY_ALIAS') ?: 'qingping'
                keyPassword System.getenv('QINGPING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.register('verifyReleaseSigning') {
    doLast {
        ['QINGPING_KEYSTORE', 'QINGPING_STORE_PASSWORD', 'QINGPING_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing release signing environment variable: $it")
        }
    }
}
tasks.configureEach {
    if (name == 'validateSigningRelease') dependsOn tasks.named('verifyReleaseSigning')
}

jacoco { toolVersion = '0.8.13' }
tasks.withType(Test).configureEach {
    jacoco { includeNoLocationClasses = true; excludes = ['jdk.internal.*'] }
}
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec')
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) {
        exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class'
    })
    reports { xml.required = true; html.required = true }
}
ext.coverageGates = [
    'cn.qingping.app.QingPingAccessibilityService': [line: 0.65, branch: 0.35],
    'cn.qingping.app.MainActivity': [line: 0.70, branch: 0.50],
    'cn.qingping.app.UsageGuideActivity': [line: 0.90, branch: 0.85],
    'cn.qingping.app.engine.AdDecisionEngine': [line: 0.95, branch: 0.75],
    'cn.qingping.app.engine.AdControlPolicy': [line: 0.95, branch: 0.80],
    'cn.qingping.app.engine.PackagePolicy': [line: 0.95, branch: 0.95],
    'cn.qingping.app.rules.ExactRule': [line: 0.90, branch: 0.70]
]
tasks.register('jacocoCriticalCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'
    executionData.from(tasks.named('jacocoTestReport').get().executionData)
    classDirectories.from(tasks.named('jacocoTestReport').get().classDirectories)
    violationRules {
        project.ext.coverageGates.each { className, gates ->
            rule {
                element = 'CLASS'
                includes = [className]
                limit { counter = 'LINE'; minimum = gates.line }
                limit { counter = 'BRANCH'; minimum = gates.branch }
            }
        }
    }
}
tasks.register('jacocoServiceCoverageVerification') {
    description = 'Compatibility alias for the shared critical-class coverage gates.'
    dependsOn 'jacocoCriticalCoverageVerification'
}

apply from: rootProject.file('scripts/verification-evidence.gradle')
